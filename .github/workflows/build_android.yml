name: Build Android APK

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Flutter APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # Java 17 is required by the Android Gradle Plugin.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      # Version comes from pubspec.yaml (environment: flutter: 3.47.6),
      # same as the upstream build workflow.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Show flutter version
        run: flutter --version

      # PiliPlus patches the Flutter framework itself (exposes private SDK
      # APIs the app depends on) plus the material_ui / cupertino_ui
      # packages. Without this step the build fails with ~180 errors.
      - name: Apply PiliPlus SDK patches
        shell: pwsh
        # FLUTTER_ROOT is exported by subosito/flutter-action above.
        run: lib/scripts/patch.ps1 android

      - name: Flutter analyze (advisory)
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        # No key.properties => falls back to the debug signing config, so the
        # release build still produces an installable APK.
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piliplus-android-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
