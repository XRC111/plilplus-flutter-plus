name: Build HarmonyOS HAP

# PiliPlus 鸿蒙版构建（Flutter-OH）。
#
# 主工程 lib/ 依赖 20+ 个尚无 ohos 实现的原生插件（media_kit / 弹幕 / 投屏 /
# WebView 等），直接 pub get 会失败。因此这里用精简 pubspec + 最小入口，
# 在临时目录里 flutter create 出鸿蒙工程再构建，产出可安装的 HAP 骨架。
# 主工程源码保留在 lib/，待插件鸿蒙化后逐步迁入。
#
# 产物为未签名 HAP（真机安装需 DevEco Studio 配签名）。
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.harmony.yaml'
      - 'lib/harmony_main.dart'
      - '.github/workflows/build-harmonyos.yml'
      - 'scripts/harmony/**'

jobs:
  harmonyos:
    name: HarmonyOS HAP (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUB_HOSTED_URL: "https://pub.flutter-io.cn"
      FLUTTER_STORAGE_BASE_URL: "https://storage.flutter-io.cn"
      # Flutter-OH 候选（每行 "仓库|分支"），按顺序尝试，第一个 clone 成功的即采用。
      #
      # 顺序说明：HuggingFace 的 command-line-tools 最高只到 6.0.1.251（API 21），
      # 而 CPF-Flutter 的 oh-3.41.9-release 引擎用了 CompetitionStrategy、
      # Window.isInFreeWindowMode 等更新 API，在 API 21 上 ArkTS 编译直接报错。
      # 因此优先用 harmonycommando 的 oh-3.22.3（面向 HarmonyOS 5.x/6.0），
      # 它能在 API 21 上编译通过；CPF 分支保留作后续 SDK 升级后的备选。
      FLUTTER_OHOS_CANDIDATES: |
        https://gitee.com/harmonycommando_flutter/flutter.git|oh-3.22.3
        https://gitcode.com/CPF-Flutter/flutter_flutter.git|oh-3.41.9-release
        https://atomgit.com/CPF-Flutter/flutter_flutter.git|oh-3.41.9-release
      # 只保留真实存在的 SDK 直链（6.1.x 在 HF 上是 404，已移除）
      HOS_SDK_URLS: >-
        https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.0.1.251.zip
        https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 恢复工具链缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/hos-sdk.pkg
            ~/flutter_ohos
          # key 变更以丢弃之前缓存的 CPF(3.41.9) 克隆
          key: hos-toolchain-sdk6.0.1-flutter322-v2
          restore-keys: |
            hos-toolchain-

      - name: 安装鸿蒙 SDK（公开直链，多镜像回退）
        run: bash scripts/harmony/setup-sdk.sh

      - name: 准备 Flutter-OH SDK（多候选 clone 回退）
        run: |
          set -uo pipefail
          export PUB_HOSTED_URL="https://pub.flutter-io.cn"
          export FLUTTER_STORAGE_BASE_URL="https://storage.flutter-io.cn"

          if [ -x "$HOME/flutter_ohos/bin/flutter" ]; then
            echo "::notice::flutter_ohos 命中缓存"
          else
            OK=0
            USED=""
            while IFS='|' read -r repo branch; do
              [ -z "${repo:-}" ] && continue
              echo "尝试 clone: $repo @ $branch"
              rm -rf "$HOME/flutter_ohos"
              if GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch "$branch" \
                  "$repo" "$HOME/flutter_ohos" 2>&1; then
                OK=1; USED="$repo|$branch"; break
              fi
              echo "::warning::clone 失败，尝试下一个候选"
            done <<< "${FLUTTER_OHOS_CANDIDATES:-}"
            if [ "$OK" -ne 1 ]; then
              echo "::error::所有 Flutter-OH 候选仓库均 clone 失败"
              exit 1
            fi
            echo "::notice::使用 $USED"
          fi

          export PATH="$HOME/flutter_ohos/bin:$PATH"
          rm -f "$HOME/flutter_ohos/bin/cache/flutter.version.json"

          # 分支无 tag 时补一个真实版本 tag，避免 pub 解析报 "no version"。
          # 版本号从当前分支/目录推导，兼容 3.22.x 与 3.41.x。
          BR=$(git -C "$HOME/flutter_ohos" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          VER=$(echo "$BR" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "${VER:-}" ]; then VER="3.22.3"; fi
          git -C "$HOME/flutter_ohos" tag "$VER" 2>/dev/null || true
          echo "flutter_ohos 分支=$BR 补 tag=$VER"

          flutter config --no-analytics >/dev/null 2>&1 || true

          echo "===== Flutter-OH 版本 ====="
          flutter --version 2>&1 | head -8 || true
          echo "===== 是否支持 ohos 平台 ====="
          flutter create --help 2>&1 | grep -i -m3 'ohos\|platforms' || true

      - name: 生成鸿蒙专用工程（隔离主工程依赖）
        run: |
          set -euo pipefail
          export PATH="$HOME/flutter_ohos/bin:$PATH"
          export PUB_HOSTED_URL="https://pub.flutter-io.cn"
          export FLUTTER_STORAGE_BASE_URL="https://storage.flutter-io.cn"

          rm -rf "$RUNNER_TEMP/harmony_app"
          mkdir -p "$RUNNER_TEMP/harmony_app/lib"
          cp pubspec.harmony.yaml "$RUNNER_TEMP/harmony_app/pubspec.yaml"
          cp lib/harmony_main.dart "$RUNNER_TEMP/harmony_app/lib/main.dart"
          cd "$RUNNER_TEMP/harmony_app"
          flutter create --platforms=ohos --org com.piliplus --project-name piliplus_harmony .
          flutter pub get
          echo "--- 生成的 ohos 工程 ---"
          ls -la ohos 2>/dev/null | head -20 || echo "::warning::未生成 ohos 目录"

      - name: 修正鸿蒙工程配置（对齐 SDK 版本字符串）
        working-directory: ${{ runner.temp }}/harmony_app
        run: |
          set -uo pipefail
          TOOLROOT=$(dirname "$DEVECO_SDK_HOME")

          # 从 SDK 的 version.txt 里读出实际版本与 API level
          HOSVER=$(grep -oE 'HarmonyOS [0-9]+\.[0-9]+\.[0-9]+' "$TOOLROOT/version.txt" | head -1 | awk '{print $2}')
          API=$(grep -oE 'apiVersion[[:space:]]*:[[:space:]]*[0-9]+' "$TOOLROOT/version.txt" | head -1 | grep -oE '[0-9]+$')
          if [ -z "${HOSVER:-}" ] || [ -z "${API:-}" ]; then
            echo "::warning::未能解析 SDK 版本，退回 6.0.1(21)"
            HOSVER="6.0.1"; API="21"
          fi
          SDKSTR="${HOSVER}(${API})"
          echo "SDKSTR=$SDKSTR"

          echo "===== 修正前 build-profile.json5 ====="
          cat ohos/build-profile.json5 || true
          echo ""

          # hvigor 00306042：API>=10 时三个 SDK 版本字段必须是 "x.y.z(NN)" 形式的字符串。
          # 具体改写逻辑见 scripts/harmony/fix-profile.cjs。
          if [ -f ohos/build-profile.json5 ]; then
            node "$GITHUB_WORKSPACE/scripts/harmony/fix-profile.cjs" ohos/build-profile.json5 "$SDKSTR"
          else
            echo "::error::ohos/build-profile.json5 不存在，flutter create 可能未生成 ohos 工程"
          fi

          echo "===== 修正后 build-profile.json5 ====="
          cat ohos/build-profile.json5 || true
          echo ""

          # hvigor 00303024：根 oh-package.json5 与 hvigor/hvigor-config.json5
          # 的 modelVersion 必须同时存在且完全相等，缺失任一都会报「项目结构需升级」
          MV=$(grep -oE '"modelVersion"[[:space:]]*:[[:space:]]*"[^"]+"' ohos/hvigor/hvigor-config.json5 2>/dev/null \
                | head -1 | grep -oE '"[^"]+"$' | tr -d '"')
          if [ -n "${MV:-}" ]; then
            if ! grep -q '"modelVersion"' ohos/oh-package.json5 2>/dev/null; then
              echo "::notice::oh-package.json5 缺少 modelVersion，补 $MV"
              sed -i "0,/{/s/{/{\n  \"modelVersion\": \"$MV\",/" ohos/oh-package.json5
            fi
          fi
          echo "===== modelVersion 一致性 ====="
          grep -n 'modelVersion' ohos/oh-package.json5 ohos/hvigor/hvigor-config.json5 2>/dev/null || true

      - name: 构建 HAP
        run: |
          set -uo pipefail
          export PATH="$HOME/flutter_ohos/bin:$PATH"
          export PUB_HOSTED_URL="https://pub.flutter-io.cn"
          export FLUTTER_STORAGE_BASE_URL="https://storage.flutter-io.cn"
          cd "$RUNNER_TEMP/harmony_app"

          flutter build hap --release 2>&1 | tail -80 || true

          echo "--- HAP 产物 ---"
          find . -name "*.hap" -type f | head -20 || true
          HAPS=$(find . -name "*.hap" -type f | wc -l | tr -d ' ')
          echo "hap_count=$HAPS"
          if [ "$HAPS" -eq 0 ]; then
            echo "::error::构建未产出 HAP"
            exit 1
          fi

      - name: 上传 HAP
        uses: actions/upload-artifact@v4
        with:
          name: piliplus-harmony-hap
          path: |
            ${{ runner.temp }}/harmony_app/**/*.hap
          if-no-files-found: warn
